<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sériescope</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="js/index.js"></script>
  </head>
  <body class="flex flex-col gap-4 text-white px-16 bg-slate-950">
    <header class="flex items-center gap-4 bg-black py-3">
      <div class="flex justify-center items-center bg-white h-9 w-9 rounded-lg">
        <img class="h-6" src="assets/icons/movie-clapper.png" alt="logo" />
      </div>
      <h2 class="text-white text-xl font-bold">Sériescope</h2>
    </header>
    <h2 class="text-4xl font-bold">Explore les séries TV</h2>
    <p class="text-gray-700">
      Retrouve tes séries préférées et enrichis le catalogue.
    </p>
    <!-- add serie -->
    <section>
      <form class="grid p-8 rounded-lg border border-gray-500" action="">
        <h2 class="mb-4 text-3xl font-bold">Ajouter une série</h2>
        <p class="mb-2 text-gray-700">
          Les champs marqués d’un * sont obligatoires.
        </p>
        <div class="flex flex-col gap-4">
          <div class="flex flex-col gap-4">
            <label class="flex flex-col gap-2" for="">
              <p>Nom de la série *</p>
              <input
                class="w-full h-11 p-4 border-gray-600 border rounded-lg"
                type="text"
                placeholder="Ex. The Bear"
              />
            </label>
            <label class="flex flex-col gap-2" for="">
              <p>Genre(s) *</p>
              <input
                class="w-full h-11 p-4 border-gray-600 border rounded-lg"
                type="text"
                placeholder="Ex. Drame, Comédie"
              />
            </label>
          </div>
          <label class="flex flex-col gap-2" for="">
            <p>Description</p>

            <textarea
              class="w-full h-20 p-4 border-gray-600 border rounded-lg"
              name=""
              id=""
              placeholder="Résume la série en quelques mots…"
            ></textarea>
          </label>
          <button
            type="submit"
            class="bg-white text-black h-14 w-52 rounded-xl cursor-pointer"
          >
            ＋ Ajouter la série
          </button>
        </div>
      </form>
    </section>
    <h2>Catalogue des séries</h2>
    <p>Recherche par nom ou explore un genre.</p>
    <!-- search and sort -->
    <section class="grid p-8 gap-4 rounded-lg border border-gray-500">
      <label class="flex flex-col gap-2" for="">
        <p>Recherche</p>
        <input
          class="w-full h-11 p-4 border-gray-600 border rounded-lg"
          type="text"
          placeholder="Ex. Breaking Bad"
        />
      </label>
      <div class="grid grid-cols-2 items-end gap-3">
        <label class="flex flex-col gap-2" for="">
          <p>Genre</p>
          <select
            class="w-full h-11 p-4 border-gray-600 border rounded-lg"
            name=""
            id=""
          >
            <option value=""></option>
            <option value=""></option>
            <option value=""></option>
          </select>
        </label>
        <button
          class="border border-gray-500 text-white h-11 p-3 rounded-xl cursor-pointer"
          type="button"
        >
          ↻ Réinitialiser
        </button>
      </div>
    </section>

    <p>6 séries affichées</p>
    <section></section>
  </body>
</html>
